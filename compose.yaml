services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/pom.xml

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      API_URL: "http://backend:8080"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - Dockerfile
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/pnpm-workspace.yaml

  # Importa crawler/data/catalogo.jsonl para o banco e termina. Não sobe no `up`:
  #   docker compose run --rm importador
  importador:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: import
      IMPORT_FILE: /data/catalogo.jsonl
    volumes:
      - ./crawler/data:/data:ro
    profiles: ["sincronizar"]

  crawler:
    build: ./crawler
    env_file: .env
    # Roda com o seu usuário, para os arquivos em crawler/data não ficarem com dono root
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./crawler/data:/app/data
    develop:
      watch:
        - action: rebuild
          path: ./crawler
          ignore:
            - data/
            - .auth/
            - .venv/
            - "**/__pycache__/"
